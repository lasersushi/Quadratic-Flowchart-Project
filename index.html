<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadratic Method Flowchart</title>
  <style>
    /* ---------- Page ---------- */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
      min-height: 100vh;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }
    header { text-align: center; margin-bottom: 24px; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 3vw, 2rem);
      letter-spacing: -0.01em;
      color: #111827;
    }
    .subtitle {
      margin: 0 0 16px;
      color: #6b7280;
      font-size: 0.95rem;
    }
    .reset {
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      background: white;
      border: 1.5px solid #e5e7eb;
      color: #1f2937;
      font: 600 0.88rem inherit;
      border-radius: 999px;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .reset:hover {
      border-color: #4f46e5;
      color: #4f46e5;
    }

    /* ---------- Flowchart SVG ---------- */
    .flowchart {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
    }

    /* Node shapes */
    .node polygon,
    .node rect,
    .node ellipse {
      transition: stroke 250ms ease, stroke-width 250ms ease, fill 250ms ease;
    }
    .node.q polygon {
      fill: #fef3c7;          /* warm yellow for decisions */
      stroke: #1f2937;
      stroke-width: 2.5;
    }
    .node.method rect {
      fill: #d1fae5;          /* light green for "use X" methods */
      stroke: #1f2937;
      stroke-width: 2.5;
    }
    .node.oval ellipse {
      fill: #ddd6fe;          /* light purple for converging terminator */
      stroke: #1f2937;
      stroke-width: 2.5;
    }
    .node.oval.dead ellipse {
      fill: #fecaca;          /* light red for dead-end */
    }

    /* Text inside nodes (rendered via <foreignObject>) */
    .node-text {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #111827;
      line-height: 1.25;
    }
    .node-text em { font-style: italic; }
    .node-text.diamond {
      font-size: 14px;
      font-weight: 600;
      padding: 16px;
    }
    .node-text.method {
      font-size: 15px;
      font-weight: 700;
      padding: 8px;
    }
    .node-text.oval {
      font-size: 15px;
      font-weight: 700;
      padding: 10px;
    }
    .node-text .tag {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .node-text.method .tag { color: #047857; }
    .node-text.oval   .tag { color: #6d28d9; }
    .node-text.oval.dead .tag { color: #b91c1c; }

    /* Edges (arrows) */
    .edge { cursor: pointer; }
    .edge path {
      stroke: #4b5563;
      stroke-width: 2.5;
      fill: none;
      transition: stroke 200ms ease;
    }
    .edge .edge-lbl rect {
      fill: white;
      stroke: #9ca3af;
      stroke-width: 1.2;
      transition: all 200ms ease;
    }
    .edge .edge-lbl text {
      font-size: 13px;
      font-weight: 700;
      fill: #4b5563;
      transition: fill 200ms ease;
    }
    .edge:hover path { stroke: #4f46e5; }
    .edge:hover .edge-lbl rect { stroke: #4f46e5; fill: #eef2ff; }
    .edge:hover .edge-lbl text { fill: #4f46e5; }

    /* "Chosen" styling */
    .edge.chosen path { stroke: #10b981; }
    .edge.chosen .edge-lbl rect { fill: #10b981; stroke: #10b981; }
    .edge.chosen .edge-lbl text { fill: white; }
    .node.chosen polygon,
    .node.chosen rect,
    .node.chosen ellipse {
      stroke: #10b981;
      stroke-width: 4;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Which method should I use to solve a quadratic?</h1>
      <p class="subtitle">
        Click a <strong>Yes</strong> or <strong>No</strong> label to trace your path through the tree.
      </p>
      <button class="reset" id="reset">Reset path</button>
    </header>

    <svg class="flowchart" viewBox="0 0 1000 1320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Two arrowhead markers so chosen arrows can have a green tip -->
        <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 12 6 L 0 12 z" fill="#4b5563" />
        </marker>
        <marker id="arrow-chosen" viewBox="0 0 12 12" refX="11" refY="6"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 12 6 L 0 12 z" fill="#10b981" />
        </marker>
      </defs>

      <!-- ============================ NODES ============================ -->

      <!-- Q1: start (diamond) -->
      <g class="node q" data-node="start">
        <polygon points="200,30 340,100 200,170 60,100" />
        <foreignObject x="60" y="30" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Do you have a quadratic equation?
          </div>
        </foreignObject>
      </g>

      <!-- R: notQuadratic (oval, dead end) -->
      <g class="node oval dead" data-node="notQuadratic">
        <ellipse cx="700" cy="100" rx="140" ry="50" />
        <foreignObject x="560" y="50" width="280" height="100">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text oval dead">
            <div>
              <span class="tag">Not applicable</span>
              Not a quadratic equation
            </div>
          </div>
        </foreignObject>
      </g>

      <!-- Q2: factorable (diamond) -->
      <g class="node q" data-node="factorable">
        <polygon points="200,220 340,290 200,360 60,290" />
        <foreignObject x="60" y="220" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Can it be easily factored?
          </div>
        </foreignObject>
      </g>

      <!-- R: useFactoring (rectangle) -->
      <g class="node method" data-node="useFactoring">
        <rect x="560" y="250" width="280" height="80" rx="14" />
        <foreignObject x="560" y="250" width="280" height="80">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text method">
            <div><span class="tag">Method</span>Use factoring!</div>
          </div>
        </foreignObject>
      </g>

      <!-- Q3: needExact (diamond) -->
      <g class="node q" data-node="needExact">
        <polygon points="200,410 340,480 200,550 60,480" />
        <foreignObject x="60" y="410" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Do you need an exact answer?
          </div>
        </foreignObject>
      </g>

      <!-- R: useGraphing -->
      <g class="node method" data-node="useGraphing">
        <rect x="560" y="440" width="280" height="80" rx="14" />
        <foreignObject x="560" y="440" width="280" height="80">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text method">
            <div><span class="tag">Method</span>Use graphing!</div>
          </div>
        </foreignObject>
      </g>

      <!-- Q4: hasBx (diamond) -->
      <g class="node q" data-node="hasBx">
        <polygon points="200,600 340,670 200,740 60,670" />
        <foreignObject x="60" y="600" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Is there a <em>bx</em> term?
          </div>
        </foreignObject>
      </g>

      <!-- R: useSquareRoots -->
      <g class="node method" data-node="useSquareRoots">
        <rect x="560" y="630" width="280" height="80" rx="14" />
        <foreignObject x="560" y="630" width="280" height="80">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text method">
            <div><span class="tag">Method</span>Use square roots!</div>
          </div>
        </foreignObject>
      </g>

      <!-- Q5: aEquals1 (diamond) — note: no method beside it, its No routes to the oval below -->
      <g class="node q" data-node="aEquals1">
        <polygon points="200,790 340,860 200,930 60,860" />
        <foreignObject x="60" y="790" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Is <em>a</em> = 1?
          </div>
        </foreignObject>
      </g>

      <!-- Q6: bxEven (diamond) -->
      <g class="node q" data-node="bxEven">
        <polygon points="200,980 340,1050 200,1120 60,1050" />
        <foreignObject x="60" y="980" width="280" height="140">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text diamond">
            Is your <em>bx</em> term even?
          </div>
        </foreignObject>
      </g>

      <!-- R: useCompletingSquare -->
      <g class="node method" data-node="useCompletingSquare">
        <rect x="560" y="1010" width="280" height="80" rx="14" />
        <foreignObject x="560" y="1010" width="280" height="80">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text method">
            <div><span class="tag">Method</span>Use completing the square!</div>
          </div>
        </foreignObject>
      </g>

      <!-- R: useQuadraticFormula (oval, shared converging terminator) -->
      <g class="node oval" data-node="useQuadraticFormula">
        <ellipse cx="500" cy="1220" rx="170" ry="55" />
        <foreignObject x="330" y="1165" width="340" height="110">
          <div xmlns="http://www.w3.org/1999/xhtml" class="node-text oval">
            <div>
              <span class="tag">Method</span>
              Use the quadratic formula!
            </div>
          </div>
        </foreignObject>
      </g>

      <!-- ============================ EDGES ============================ -->

      <!-- start → No → notQuadratic -->
      <g class="edge" data-from="start" data-ans="no">
        <path d="M 340 100 L 560 100" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 85)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

      <!-- start → Yes → factorable -->
      <g class="edge" data-from="start" data-ans="yes">
        <path d="M 200 170 L 200 220" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 195)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- factorable → Yes → useFactoring -->
      <g class="edge" data-from="factorable" data-ans="yes">
        <path d="M 340 290 L 560 290" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 275)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- factorable → No → needExact -->
      <g class="edge" data-from="factorable" data-ans="no">
        <path d="M 200 360 L 200 410" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 385)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

      <!-- needExact → No → useGraphing -->
      <g class="edge" data-from="needExact" data-ans="no">
        <path d="M 340 480 L 560 480" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 465)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

      <!-- needExact → Yes → hasBx -->
      <g class="edge" data-from="needExact" data-ans="yes">
        <path d="M 200 550 L 200 600" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 575)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- hasBx → No → useSquareRoots -->
      <g class="edge" data-from="hasBx" data-ans="no">
        <path d="M 340 670 L 560 670" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 655)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

      <!-- hasBx → Yes → aEquals1 -->
      <g class="edge" data-from="hasBx" data-ans="yes">
        <path d="M 200 740 L 200 790" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 765)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- aEquals1 → No → useQuadraticFormula (routes right, then down, then left into oval) -->
      <g class="edge" data-from="aEquals1" data-ans="no">
        <path d="M 340 860 L 900 860 L 900 1220 L 670 1220" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 845)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

      <!-- aEquals1 → Yes → bxEven -->
      <g class="edge" data-from="aEquals1" data-ans="yes">
        <path d="M 200 930 L 200 980" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 955)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- bxEven → Yes → useCompletingSquare -->
      <g class="edge" data-from="bxEven" data-ans="yes">
        <path d="M 340 1050 L 560 1050" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(450, 1035)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">Yes</text>
        </g>
      </g>

      <!-- bxEven → No → useQuadraticFormula (down, then right into oval) -->
      <g class="edge" data-from="bxEven" data-ans="no">
        <path d="M 200 1120 L 200 1220 L 330 1220" marker-end="url(#arrow)" />
        <g class="edge-lbl" transform="translate(232, 1170)">
          <rect x="-18" y="-12" width="36" height="22" rx="11" />
          <text x="0" y="3" text-anchor="middle">No</text>
        </g>
      </g>

    </svg>
  </div>

  <script>
    // Two paths (aEquals1→No and bxEven→No) both point to the same id —
    // that's what makes useQuadraticFormula visually converge in the SVG.
    const tree = {
      start:      { yes: "factorable",          no: "notQuadratic"        },
      factorable: { yes: "useFactoring",        no: "needExact"           },
      needExact:  { yes: "hasBx",               no: "useGraphing"         },
      hasBx:      { yes: "aEquals1",            no: "useSquareRoots"      },
      aEquals1:   { yes: "bxEven",              no: "useQuadraticFormula" },
      bxEven:     { yes: "useCompletingSquare", no: "useQuadraticFormula" },
    };

    const results = new Set([
      "notQuadratic", "useFactoring", "useGraphing", "useSquareRoots",
      "useCompletingSquare", "useQuadraticFormula",
    ]);

    const path = [];

    function clearHighlights() {
      document.querySelectorAll(".chosen").forEach(el => el.classList.remove("chosen"));
      document.querySelectorAll(".edge path").forEach(p => {
        p.setAttribute("marker-end", "url(#arrow)");
      });
    }

    function render() {
      clearHighlights();
      let current = "start";
      for (const { from, ans } of path) {
        if (from !== current) break;
        const next = tree[current][ans];

        document.querySelector(`[data-node="${current}"]`).classList.add("chosen");
        const edge = document.querySelector(
          `g.edge[data-from="${current}"][data-ans="${ans}"]`
        );
        edge.classList.add("chosen");
        edge.querySelector("path").setAttribute("marker-end", "url(#arrow-chosen)");

        const nextEl = document.querySelector(`[data-node="${next}"]`);
        if (nextEl) nextEl.classList.add("chosen");

        current = next;
        if (results.has(current)) break;
      }
    }

    document.addEventListener("click", e => {
      const edge = e.target.closest("g.edge");
      if (!edge) return;
      const from = edge.dataset.from;
      const ans  = edge.dataset.ans;
      const idx = path.findIndex(c => c.from === from);
      if (idx === -1) {
        path.push({ from, ans });
      } else {
        path[idx] = { from, ans };
        path.length = idx + 1;
      }
      render();
    });

    document.getElementById("reset").addEventListener("click", () => {
      path.length = 0;
      clearHighlights();
    });
  </script>
</body>
</html>
